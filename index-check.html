<!DOCTYPE html>
<!-- 
ELAYON SPACE — INDEX CHECK
Painel de verificação de saúde do sistema para acompanhamento técnico.
Mostra estado de todas as integrações e serviços críticos.
Não requer autenticação. Dados simulados até integração real.
Página temporária de demonstração para evolução de integrações.
-->
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elayon Space — Index Check</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f7f8;
      color: #21444d;
      min-height: 100vh;
    }

    .wrapper {
      width: min(1120px, calc(100% - 32px));
      margin: 20px auto 28px;
    }

    .breadcrumb {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .breadcrumb a { color: #3a7d8c; text-decoration: none; font-weight: 600; }
    .breadcrumb a:hover { text-decoration: underline; }

    .header {
      background: #fff;
      border: 1px solid #d4e7ea;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img { width: 54px; }
    .brand h1 { font-size: clamp(1.15rem, 2vw, 1.4rem); color: #3a7d8c; }

    .public-note {
      font-size: 0.82rem;
      color: #4d7f88;
      background: #ecf7f4;
      border: 1px solid #d3ece4;
      border-radius: 999px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .panel {
      background: #fff;
      border: 1px solid #d4e7ea;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .panel h2 { color: #3a7d8c; font-size: 1rem; margin-bottom: 14px; }

    .integrations {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .item {
      border: 1px solid #d4e7ea;
      border-radius: 14px;
      padding: 12px;
      background: #fbfeff;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-name { font-weight: 700; color: #2c6370; }

    .status {
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-online { color: #217352; background: #e7f8f0; }
    .status-offline { color: #a53030; background: #feecec; }
    .status-awaiting { color: #8a6a12; background: #fff7e3; }
    .status-error { color: #a45a17; background: #fff1e5; }
    .status-maintenance { color: #8a6a12; background: #fff7e3; }
    .status-unconfigured { color: #5f6670; background: #f0f2f5; }

    .item dl {
      display: grid;
      grid-template-columns: 70px 1fr;
      row-gap: 5px;
      font-size: 0.82rem;
      color: #4d7f88;
    }

    .item dt { font-weight: 600; }

    .item a { color: #3a7d8c; text-decoration: none; }
    .item a:hover { text-decoration: underline; }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: #4d7f88;
      margin-bottom: 8px;
    }

    .refresh {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #3a7d8c, #5bb5a2);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .logs {
      font-size: 0.84rem;
      color: #4d7f88;
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      padding-right: 4px;
    }

    .log-row {
      border: 1px dashed #c8dde2;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fbfeff;
    }

    .last-check {
      font-size: 0.84rem;
      color: #4d7f88;
    }

    @media (max-width: 980px) {
      .integrations { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .wrapper { width: calc(100% - 20px); margin: 14px auto 22px; }
      .header { flex-direction: column; align-items: flex-start; }
      .public-note { white-space: normal; }
      .item dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <nav class="breadcrumb" aria-label="Navegação">
      <a href="index.html">Entrada</a>
      <span>•</span>
      <a href="acesso.html">Acesso</a>
      <span>•</span>
      <strong>Index Check</strong>
    </nav>

    <header class="header">
      <div class="brand">
        <img src="IMG-20260218-WA0015.jpg" alt="Logo Elayon">
        <h1>Elayon Space — Index Check</h1>
      </div>
      <p class="public-note">Painel técnico em modo demonstração pública (sem dados sensíveis)</p>
    </header>

    <section class="panel">
      <h2>Integrações Configuradas</h2>
      <div class="integrations" id="integrations"></div>
    </section>

    <section class="panel summary">
      <div>
        <h2>Estado Geral</h2>
        <div class="stats" id="stats"></div>
        <p id="last-check" class="last-check" aria-live="polite"></p>
      </div>
      <button class="refresh" id="refresh" type="button">Atualizar verificação</button>
    </section>

    <section class="panel">
      <h2>Logs</h2>
      <div class="logs" id="logs"></div>
    </section>
  </div>

  <script>
    const integracoes = [
      { nome: "Supabase Auth", status: "online", endpoint: "endpoint oculto (modo público)", ultimaVerificacao: "2026-09-10 01:35", linkDoc: "https://supabase.com/docs" },
      { nome: "Render Backend", status: "online", endpoint: "endpoint oculto (modo público)", ultimaVerificacao: "2026-09-10 01:34", linkDoc: "https://render.com/docs" },
      { nome: "Núcleo CRS", status: "online", endpoint: "endpoint oculto (modo público)", ultimaVerificacao: "2026-09-10 01:33", linkDoc: "tecnologia.html" },
      { nome: "Presença Lab", status: "offline", endpoint: "endpoint oculto (modo público)", ultimaVerificacao: "2026-09-10 01:20", linkDoc: "ecossistema.html" },
      { nome: "PsyQ", status: "awaiting", endpoint: "não configurado", ultimaVerificacao: "—", linkDoc: "ecossistema.html" },
      { nome: "Síntese", status: "awaiting", endpoint: "não configurado", ultimaVerificacao: "—", linkDoc: "ecossistema.html" },
      { nome: "Validação", status: "awaiting", endpoint: "não configurado", ultimaVerificacao: "—", linkDoc: "ecossistema.html" },
      { nome: "Conversação IA", status: "awaiting", endpoint: "não configurado", ultimaVerificacao: "—", linkDoc: "ecossistema.html" }
    ];

    const labels = {
      online: { text: "✅ Online", cls: "status-online" },
      offline: { text: "❌ Offline", cls: "status-offline" },
      awaiting: { text: "⏳ Aguardando", cls: "status-awaiting" },
      error: { text: "⚠️ Erro", cls: "status-error" },
      maintenance: { text: "⏳ Manutenção", cls: "status-maintenance" },
      unconfigured: { text: "◻️ Não configurado", cls: "status-unconfigured" }
    };

    const integrationsEl = document.getElementById('integrations');
    const statsEl = document.getElementById('stats');
    const lastCheckEl = document.getElementById('last-check');
    const logsEl = document.getElementById('logs');
    const refreshBtn = document.getElementById('refresh');
    const LOG_LIMIT = 20;

    function normalizedStatus(item) {
      return item.status === 'awaiting' && item.endpoint === 'não configurado' ? 'unconfigured' : item.status;
    }

    function nowString() {
      const d = new Date();
      const pad = (v) => String(v).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function cardTemplate(item) {
      const resolvedStatus = normalizedStatus(item);
      const status = labels[resolvedStatus] || labels.error;
      const article = document.createElement('article');
      article.className = 'item';

      const head = document.createElement('div');
      head.className = 'item-head';

      const name = document.createElement('strong');
      name.className = 'item-name';
      name.textContent = item.nome;

      const badge = document.createElement('span');
      badge.className = `status ${status.cls}`;
      badge.textContent = status.text;

      head.append(name, badge);

      const infoList = document.createElement('dl');
      const rows = [
        ['Endpoint', item.endpoint],
        ['Última', item.ultimaVerificacao]
      ];

      rows.forEach(([label, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = label;
        const dd = document.createElement('dd');
        dd.textContent = value;
        infoList.append(dt, dd);
      });

      const dtDoc = document.createElement('dt');
      dtDoc.textContent = 'Doc';
      const ddDoc = document.createElement('dd');
      const docLink = document.createElement('a');
      docLink.href = item.linkDoc;
      const isExternal = /^https?:\/\//i.test(item.linkDoc);
      if (isExternal) {
        docLink.target = '_blank';
        docLink.rel = 'noopener noreferrer';
      }
      docLink.textContent = isExternal
        ? `Abrir doc de ${item.nome} (nova aba)`
        : `Abrir doc de ${item.nome}`;
      ddDoc.appendChild(docLink);
      infoList.append(dtDoc, ddDoc);

      article.append(head, infoList);
      return article;
    }

    function render() {
      integrationsEl.replaceChildren(...integracoes.map(cardTemplate));

      const resolvedStatuses = integracoes.map(normalizedStatus);
      const online = resolvedStatuses.filter((status) => status === 'online').length;
      const offline = resolvedStatuses.filter((status) => status === 'offline' || status === 'error').length;
      const awaiting = resolvedStatuses.filter((status) => status === 'awaiting' || status === 'maintenance' || status === 'unconfigured').length;

      const onlineStat = document.createElement('strong');
      onlineStat.textContent = `Online: ${online}`;
      const offlineStat = document.createElement('strong');
      offlineStat.textContent = `Offline/Erro: ${offline}`;
      const awaitingStat = document.createElement('strong');
      awaitingStat.textContent = `Aguardando: ${awaiting}`;
      statsEl.replaceChildren(onlineStat, offlineStat, awaitingStat);

      const checkedAt = nowString();
      lastCheckEl.textContent = `Última verificação geral: ${checkedAt}`;
      const logRow = document.createElement('div');
      logRow.className = 'log-row';
      logRow.textContent = `${checkedAt} • Verificação concluída (${online} online, ${offline} offline/erro, ${awaiting} aguardando).`;
      logsEl.prepend(logRow);
      while (logsEl.children.length > LOG_LIMIT) {
        logsEl.removeChild(logsEl.lastElementChild);
      }
    }

    refreshBtn.addEventListener('click', () => {
      const timestamp = nowString();
      integracoes.forEach((item) => {
        if (normalizedStatus(item) !== 'unconfigured') {
          item.ultimaVerificacao = timestamp;
        }
      });
      render();
    });

    render();
  </script>
</body>
</html>
