<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elayon Space • Acesso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f5;
      color: #2a2a2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d0e4e8;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(58, 125, 140, 0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo img {
      width: 90px;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-size: 1.6rem;
      color: #3a7d8c;
      letter-spacing: 1px;
    }

    .logo p {
      font-size: 0.82rem;
      color: #5bb5a2;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid #c0dde3;
      border-radius: 8px;
      background: transparent;
      color: #3a7d8c;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #3a7d8c;
      color: #ffffff;
      border-color: #3a7d8c;
      font-weight: bold;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.85rem;
      color: #5a8a94;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #f5fafb;
      border: 1px solid #c0dde3;
      border-radius: 8px;
      color: #2a2a2a;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3a7d8c;
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3a7d8c, #5bb5a2);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #5bb5a2;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 16px;
      display: block;
      text-align: center;
    }

    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .mensagem.sucesso {
      background: #e8f7f4;
      color: #2a7a5a;
      border: 1px solid #5bb5a2;
    }

    .mensagem.erro {
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #e88;
    }

    .secao { display: none; }
    .secao.ativa { display: block; }

    .rodape {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: #aaa;
    }

    .rodape a { color: #5bb5a2; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="IMG-20260218-WA0015.jpg" alt="Logo Elayon">
    <h1>Elayon</h1>
    <p>Humanidade e Tecnologia em Harmonia</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mostrarSecao('login')">Entrar</button>
    <button class="tab" onclick="mostrarSecao('cadastro')">Cadastrar</button>
  </div>

  <!-- LOGIN -->
  <div id="secao-login" class="secao ativa">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <button class="link-btn" onclick="mostrarSecao('recuperar')">Esqueci minha senha</button>
    <div id="msg-login" class="mensagem"></div>
  </div>

  <!-- CADASTRO -->
  <div id="secao-cadastro" class="secao">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="cadastro-nome" placeholder="Seu nome">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="cadastro-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="cadastro-senha" placeholder="mínimo 6 caracteres">
    </div>
    <button class="btn-primary" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
    <div id="msg-cadastro" class="mensagem"></div>
  </div>

  <!-- RECUPERAR SENHA -->
  <div id="secao-recuperar" class="secao">
    <div class="form-group">
      <label>Email da sua conta</label>
      <input type="email" id="recuperar-email" placeholder="seu@email.com">
    </div>
    <button class="btn-primary" onclick="recuperarSenha()">Enviar link de recuperação</button>
    <button class="link-btn" onclick="mostrarSecao('login')">← Voltar para o login</button>
    <div id="msg-recuperar" class="mensagem"></div>
  </div>

  <div class="rodape">
    <a href="https://elayon.space">← Voltar ao site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://eudcjihffrfmhzmfwtlg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZGNqaWhmZnJmbWh6bWZ3dGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDE3MjUsImV4cCI6MjA5MDMxNzcyNX0.2tod6vvl_4SAXzSmW1wU8Mk9pLn8fvhF2xrAZOysUu0'
  );

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'painel.html';
  });

  function mostrarSecao(secao) {
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('secao-' + secao).classList.add('ativa');
    if (secao === 'login') document.querySelectorAll('.tab')[0].classList.add('active');
    if (secao === 'cadastro') document.querySelectorAll('.tab')[1].classList.add('active');
  }

  function mostrarMensagem(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'mensagem ' + tipo;
    el.style.display = 'block';
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('btn-login');
    if (!email || !senha) { mostrarMensagem('msg-login', 'Preencha email e senha.', 'erro'); return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) {
      mostrarMensagem('msg-login', 'Email ou senha incorretos.', 'erro');
      btn.disabled = false; btn.textContent = 'Entrar';
    } else {
      window.location.href = 'painel.html';
    }
  }

  async function fazerCadastro() {
    const nome = document.getElementById('cadastro-nome').value.trim();
    const email = document.getElementById('cadastro-email').value.trim();
    const senha = document.getElementById('cadastro-senha').value;
    const btn = document.getElementById('btn-cadastro');
    if (!nome || !email || !senha) { mostrarMensagem('msg-cadastro', 'Preencha todos os campos.', 'erro'); return; }
    if (senha.length < 6) { mostrarMensagem('msg-cadastro', 'Senha mínima: 6 caracteres.', 'erro'); return; }
    btn.disabled = true; btn.textContent = 'Criando conta...';
    const { error } = await sb.auth.signUp({
      email, password: senha,
      options: {
        data: { nome_completo: nome },
        emailRedirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
      }
    });
    if (error) {
      mostrarMensagem('msg-cadastro', 'Erro: ' + error.message, 'erro');
      btn.disabled = false; btn.textContent = 'Criar conta';
    } else {
      mostrarMensagem('msg-cadastro', '✓ Verifique seu email para confirmar o acesso.', 'sucesso');
      btn.textContent = 'Email enviado ✓';
    }
  }

  async function recuperarSenha() {
    const email = document.getElementById('recuperar-email').value.trim();
    if (!email) { mostrarMensagem('msg-recuperar', 'Digite seu email.', 'erro'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
    });
    if (error) {
      mostrarMensagem('msg-recuperar', 'Erro ao enviar email.', 'erro');
    } else {
      mostrarMensagem('msg-recuperar', '✓ Link enviado! Verifique seu email.', 'sucesso');
    }
  }
</script>
</body>
</html>
