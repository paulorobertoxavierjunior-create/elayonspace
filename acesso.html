<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elayon Space • Acesso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 1.6rem;
      color: #c9a84c;
      letter-spacing: 2px;
    }

    .logo p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #c9a84c;
      color: #0a0a0a;
      border-color: #c9a84c;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #c9a84c;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #c9a84c;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 16px;
      display: block;
      text-align: center;
    }

    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .mensagem.sucesso {
      background: #1a3a1a;
      color: #6fcf6f;
      border: 1px solid #2a5a2a;
    }

    .mensagem.erro {
      background: #3a1a1a;
      color: #cf6f6f;
      border: 1px solid #5a2a2a;
    }

    .secao { display: none; }
    .secao.ativa { display: block; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>ELAYON</h1>
    <p>presença, escuta e inteligência</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mostrarSecao('login')">Entrar</button>
    <button class="tab" onclick="mostrarSecao('cadastro')">Cadastrar</button>
  </div>

  <!-- LOGIN -->
  <div id="secao-login" class="secao ativa">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <button class="link-btn" onclick="mostrarSecao('recuperar')">Esqueci minha senha</button>
    <div id="msg-login" class="mensagem"></div>
  </div>

  <!-- CADASTRO -->
  <div id="secao-cadastro" class="secao">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="cadastro-nome" placeholder="Seu nome">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="cadastro-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="cadastro-senha" placeholder="mínimo 6 caracteres">
    </div>
    <button class="btn-primary" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
    <div id="msg-cadastro" class="mensagem"></div>
  </div>

  <!-- RECUPERAR SENHA -->
  <div id="secao-recuperar" class="secao">
    <div class="form-group">
      <label>Email da sua conta</label>
      <input type="email" id="recuperar-email" placeholder="seu@email.com">
    </div>
    <button class="btn-primary" onclick="recuperarSenha()">Enviar link de recuperação</button>
    <button class="link-btn" onclick="mostrarSecao('login')">← Voltar para o login</button>
    <div id="msg-recuperar" class="mensagem"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;

  const sb = createClient(
    'https://eudcjihffrfmhzmfwtlg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZGNqaWhmZnJmbWh6bWZ3dGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NDE3MjUsImV4cCI6MjA5MDMxNzcyNX0.2tod6vvl_4SAXzSmW1wU8Mk9pLn8fvhF2xrAZOysUu0'
  );

  // Se já está logado, vai direto pro painel
  sb.auth.getSession().then(({ data }) => {
    if (data.session) {
      window.location.href = 'painel.html';
    }
  });

  function mostrarSecao(secao) {
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('secao-' + secao).classList.add('ativa');
    if (secao === 'login') document.querySelectorAll('.tab')[0].classList.add('active');
    if (secao === 'cadastro') document.querySelectorAll('.tab')[1].classList.add('active');
  }

  function mostrarMensagem(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'mensagem ' + tipo;
    el.style.display = 'block';
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('btn-login');

    if (!email || !senha) {
      mostrarMensagem('msg-login', 'Preencha email e senha.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const { error } = await sb.auth.signInWithPassword({ email, password: senha });

    if (error) {
      mostrarMensagem('msg-login', 'Email ou senha incorretos.', 'erro');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    } else {
      window.location.href = 'painel.html';
    }
  }

  async function fazerCadastro() {
    const nome = document.getElementById('cadastro-nome').value.trim();
    const email = document.getElementById('cadastro-email').value.trim();
    const senha = document.getElementById('cadastro-senha').value;
    const btn = document.getElementById('btn-cadastro');

    if (!nome || !email || !senha) {
      mostrarMensagem('msg-cadastro', 'Preencha todos os campos.', 'erro');
      return;
    }

    if (senha.length < 6) {
      mostrarMensagem('msg-cadastro', 'Senha deve ter no mínimo 6 caracteres.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Criando conta...';

    const { error } = await sb.auth.signUp({
      email,
      password: senha,
      options: {
        data: { nome_completo: nome },
        emailRedirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
      }
    });

    if (error) {
      mostrarMensagem('msg-cadastro', 'Erro ao criar conta: ' + error.message, 'erro');
      btn.disabled = false;
      btn.textContent = 'Criar conta';
    } else {
      mostrarMensagem('msg-cadastro', '✓ Conta criada! Verifique seu email para confirmar o acesso.', 'sucesso');
      btn.textContent = 'Email enviado';
    }
  }

  async function recuperarSenha() {
    const email = document.getElementById('recuperar-email').value.trim();

    if (!email) {
      mostrarMensagem('msg-recuperar', 'Digite seu email.', 'erro');
      return;
    }

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
    });

    if (error) {
      mostrarMensagem('msg-recuperar', 'Erro ao enviar email.', 'erro');
    } else {
      mostrarMensagem('msg-recuperar', '✓ Link enviado para seu email.', 'sucesso');
    }
  }
</script>

</body>
</html>
