<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elayon Space • Acesso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f5;
      color: #2a2a2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d0e4e8;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(58, 125, 140, 0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo img {
      width: 90px;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-size: 1.6rem;
      color: #3a7d8c;
      letter-spacing: 1px;
    }

    .logo p {
      font-size: 0.82rem;
      color: #5bb5a2;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid #c0dde3;
      border-radius: 8px;
      background: transparent;
      color: #3a7d8c;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #3a7d8c;
      color: #ffffff;
      border-color: #3a7d8c;
      font-weight: bold;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.85rem;
      color: #5a8a94;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #f5fafb;
      border: 1px solid #c0dde3;
      border-radius: 8px;
      color: #2a2a2a;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3a7d8c;
      background: #ffffff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3a7d8c, #5bb5a2);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #5bb5a2;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 16px;
      display: block;
      text-align: center;
    }

    .mensagem {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .mensagem.sucesso {
      background: #e8f7f4;
      color: #2a7a5a;
      border: 1px solid #5bb5a2;
    }

    .mensagem.erro {
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #e88;
    }

    .secao { display: none; }
    .secao.ativa { display: block; }

    .rodape {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: #aaa;
    }

    .rodape a { color: #5bb5a2; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="IMG-20260218-WA0015.jpg" alt="Logo Elayon">
    <h1>Elayon</h1>
    <p>Humanidade e Tecnologia em Harmonia</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mostrarSecao('login')">Entrar</button>
    <button class="tab" onclick="mostrarSecao('cadastro')">Cadastrar</button>
  </div>

  <!-- LOGIN -->
  <div id="secao-login" class="secao ativa">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <button class="link-btn" onclick="mostrarSecao('recuperar')">Esqueci minha senha</button>
    <div id="msg-login" class="mensagem"></div>
  </div>

  <!-- CADASTRO -->
  <div id="secao-cadastro" class="secao">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="cadastro-nome" placeholder="Seu nome">
    </div>
    <div class="form-group">
      <label>ID CRS</label>
      <input type="text" id="cadastro-crs-id" placeholder="ex: CRS-0001">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="cadastro-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Token de acesso</label>
      <input type="text" id="cadastro-token" placeholder="Seu código único">
    </div>
    <button class="link-btn" onclick="adicionarTokenGratis()">Adicionar grátis (teste)</button>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="cadastro-senha" placeholder="mínimo 6 caracteres">
    </div>
    <button class="btn-primary" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
    <div id="msg-cadastro" class="mensagem"></div>
  </div>

  <!-- RECUPERAR SENHA -->
  <div id="secao-recuperar" class="secao">
    <div class="form-group">
      <label>Email da sua conta</label>
      <input type="email" id="recuperar-email" placeholder="seu@email.com">
    </div>
    <button class="btn-primary" onclick="recuperarSenha()">Enviar link de recuperação</button>
    <button class="link-btn" onclick="mostrarSecao('login')">← Voltar para o login</button>
    <div id="msg-recuperar" class="mensagem"></div>
  </div>

  <div class="rodape">
    <a href="https://elayon.space">← Voltar ao site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://eudcjihffrfmhzmfwtlg.supabase.co',
    '******'
  );

  const FLOW = {
    cadastro: {
      PENDENTE: 'pendente_confirmacao',
      VALIDO: 'valido',
      BLOQUEADO: 'bloqueado'
    },
    token: {
      VALIDO: 'valido',
      VALIDO_TESTE: 'valido_teste',
      CONSUMIDO: 'consumido',
      INVALIDO: 'invalido',
      EXPIRADO: 'expirado'
    },
    sessao: {
      AUTENTICADA: 'autenticada',
      NAO_AUTENTICADA: 'nao_autenticada'
    }
  };

  const API_TIMEOUT_MS = 7000;
  const API_BASE = window.CRS_CONFIG?.apiBase || 'https://crs-full-api.onrender.com';

  function withTimeout(promiseFactory, timeout = API_TIMEOUT_MS) {
    return Promise.race([
      promiseFactory(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), timeout))
    ]);
  }

  async function postJson(url, payload) {
    const response = await withTimeout(() => fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }));

    if (!response.ok) {
      throw new Error('http_' + response.status);
    }

    return response.json();
  }

  const authApi = {
    signIn: (email, password) => sb.auth.signInWithPassword({ email, password }),
    signUp: (email, password, data) => sb.auth.signUp({
      email,
      password,
      options: {
        data,
        emailRedirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
      }
    }),
    getSession: () => sb.auth.getSession(),
    signOut: () => sb.auth.signOut(),
    resetPassword: (email) => sb.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://paulorobertoxavierjunior-create.github.io/elayonspace/confirmacao.html'
    })
  };

  const tokenApi = {
    async validate(token, crsId, email) {
      if (token === 'TOKEN-GRATIS-TESTE') {
        return { ok: true, state: FLOW.token.VALIDO_TESTE, source: 'local' };
      }

      try {
        const data = await postJson(`${API_BASE}/tokens/validate`, { token, crsId, email });
        if (data?.valid === true) {
          return { ok: true, state: FLOW.token.VALIDO, source: 'remote' };
        }
        return { ok: false, state: data?.state || FLOW.token.INVALIDO, message: data?.message || 'Token inválido.' };
      } catch (_) {
        return { ok: false, state: 'indisponivel', message: 'Serviço de token indisponível no momento.' };
      }
    },

    async consume(token, email) {
      if (token === 'TOKEN-GRATIS-TESTE') {
        return { ok: true, state: FLOW.token.VALIDO_TESTE, source: 'local' };
      }

      try {
        const data = await postJson(`${API_BASE}/tokens/consume`, { token, email });
        if (data?.ok === true) {
          return { ok: true, state: data?.state || FLOW.token.CONSUMIDO, source: 'remote' };
        }
        return { ok: false, state: data?.state || FLOW.token.INVALIDO, message: data?.message || 'Token já utilizado ou inválido.' };
      } catch (_) {
        return { ok: false, state: 'indisponivel', message: 'Não foi possível consumir o token agora.' };
      }
    }
  };

  function normalizarCrsId(valor) {
    return valor.toUpperCase().replace(/\s+/g, '');
  }

  function mostrarSecao(secao) {
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('secao-' + secao).classList.add('ativa');
    if (secao === 'login') document.querySelectorAll('.tab')[0].classList.add('active');
    if (secao === 'cadastro') document.querySelectorAll('.tab')[1].classList.add('active');
  }

  function mostrarMensagem(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'mensagem ' + tipo;
    el.style.display = 'block';
  }

  function adicionarTokenGratis() {
    document.getElementById('cadastro-token').value = 'TOKEN-GRATIS-TESTE';
    mostrarMensagem('msg-cadastro', 'Token grátis de teste adicionado.', 'sucesso');
  }

  function tratarMensagensURL() {
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const reason = params.get('reason');

    if (status === 'email_confirmado') {
      mostrarMensagem('msg-login', 'Email confirmado. Agora faça login.', 'sucesso');
    }

    if (reason === 'confirmar_email') {
      mostrarMensagem('msg-login', 'Confirme seu email antes de entrar no cockpit.', 'erro');
    }

    if (reason === 'sem_sessao') {
      mostrarMensagem('msg-login', 'Faça login para acessar o cockpit.', 'erro');
    }

    if (reason === 'token_invalido') {
      mostrarMensagem('msg-login', 'Seu token não está pronto para operação.', 'erro');
    }
  }

  async function validarSessaoAtual() {
    try {
      const { data } = await withTimeout(() => authApi.getSession());
      if (data.session) {
        window.location.href = 'painel.html';
      }
    } catch (_) {
      mostrarMensagem('msg-login', 'Não foi possível validar sessão agora. Tente novamente.', 'erro');
    }
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('btn-login');

    if (!email || !senha) {
      mostrarMensagem('msg-login', 'Preencha email e senha.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const { error } = await withTimeout(() => authApi.signIn(email, senha));
      if (error) {
        mostrarMensagem('msg-login', 'Email ou senha incorretos.', 'erro');
        return;
      }

      const { data } = await withTimeout(() => authApi.getSession());
      const user = data.session?.user;

      if (!user) {
        mostrarMensagem('msg-login', 'Sessão inválida. Tente novamente.', 'erro');
        return;
      }

      if (!user.email_confirmed_at) {
        await authApi.signOut();
        mostrarMensagem('msg-login', 'Confirme seu email antes de continuar.', 'erro');
        return;
      }

      const metadata = user.user_metadata || {};
      const tokenStatus = metadata.token_status;
      const tokenPermitido = [FLOW.token.VALIDO, FLOW.token.VALIDO_TESTE, FLOW.token.CONSUMIDO].includes(tokenStatus);

      if (!metadata.crs_id || !tokenPermitido) {
        await authApi.signOut();
        mostrarMensagem('msg-login', 'Cadastro sem autorização completa (ID/Token).', 'erro');
        return;
      }

      window.location.href = 'painel.html';
    } catch (_) {
      mostrarMensagem('msg-login', 'Falha de conexão. Tente novamente.', 'erro');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }

  async function fazerCadastro() {
    const nome = document.getElementById('cadastro-nome').value.trim();
    const crsId = normalizarCrsId(document.getElementById('cadastro-crs-id').value.trim());
    const email = document.getElementById('cadastro-email').value.trim();
    const token = document.getElementById('cadastro-token').value.trim();
    const senha = document.getElementById('cadastro-senha').value;
    const btn = document.getElementById('btn-cadastro');

    if (!nome || !crsId || !email || !token || !senha) {
      mostrarMensagem('msg-cadastro', 'Preencha todos os campos.', 'erro');
      return;
    }

    if (senha.length < 6) {
      mostrarMensagem('msg-cadastro', 'Senha mínima: 6 caracteres.', 'erro');
      return;
    }

    if (crsId.length < 4) {
      mostrarMensagem('msg-cadastro', 'ID CRS inválido.', 'erro');
      return;
    }

    if (token.length < 6) {
      mostrarMensagem('msg-cadastro', 'Token inválido.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Validando token...';

    try {
      const validacao = await tokenApi.validate(token, crsId, email);
      if (!validacao.ok) {
        mostrarMensagem('msg-cadastro', validacao.message || 'Token bloqueado.', 'erro');
        return;
      }

      btn.textContent = 'Consumindo token...';
      const consumo = await tokenApi.consume(token, email);
      if (!consumo.ok) {
        mostrarMensagem('msg-cadastro', consumo.message || 'Não foi possível usar seu token.', 'erro');
        return;
      }

      btn.textContent = 'Criando conta...';
      const { error } = await withTimeout(() => authApi.signUp(email, senha, {
        nome_completo: nome,
        crs_id: crsId,
        cadastro_status: FLOW.cadastro.PENDENTE,
        token_status: consumo.state || validacao.state,
        token_final: token.slice(-4),
        owner_check: false
      }));

      if (error) {
        mostrarMensagem('msg-cadastro', 'Erro: ' + error.message, 'erro');
        return;
      }

      mostrarMensagem('msg-cadastro', '✓ Verifique seu email para confirmar o acesso e depois faça login.', 'sucesso');
      btn.textContent = 'Email enviado ✓';
    } catch (_) {
      mostrarMensagem('msg-cadastro', 'Falha de comunicação com serviços. Tente novamente.', 'erro');
    } finally {
      btn.disabled = false;
      if (btn.textContent !== 'Email enviado ✓') {
        btn.textContent = 'Criar conta';
      }
    }
  }

  async function recuperarSenha() {
    const email = document.getElementById('recuperar-email').value.trim();
    if (!email) {
      mostrarMensagem('msg-recuperar', 'Digite seu email.', 'erro');
      return;
    }

    try {
      const { error } = await withTimeout(() => authApi.resetPassword(email));
      if (error) {
        mostrarMensagem('msg-recuperar', 'Erro ao enviar email.', 'erro');
      } else {
        mostrarMensagem('msg-recuperar', '✓ Link enviado! Verifique seu email.', 'sucesso');
      }
    } catch (_) {
      mostrarMensagem('msg-recuperar', 'Falha de conexão. Tente novamente.', 'erro');
    }
  }

  tratarMensagensURL();
  validarSessaoAtual();
</script>
</body>
</html>
