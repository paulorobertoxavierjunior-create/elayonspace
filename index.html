<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elayon Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f7f8;
      color: #21444d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 16px 32px;
    }

    .hero {
      width: min(760px, 100%);
      background: #ffffff;
      border: 1px solid #d4e7ea;
      border-radius: 24px;
      padding: 56px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(58, 125, 140, 0.08);
    }

    .hero img {
      width: 92px;
      margin-bottom: 16px;
    }

    .hero h1 {
      color: #3a7d8c;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: 10px;
    }

    .hero p {
      color: #4d7f88;
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #3a7d8c, #5bb5a2);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 30px;
      border-radius: 12px;
      transition: opacity 0.2s;
    }

    .cta:hover { opacity: 0.9; }

    footer {
      border-top: 1px solid #d4e7ea;
      padding: 18px 16px 24px;
      text-align: center;
      font-size: 0.88rem;
      color: #4d7f88;
    }

    .footer-links {
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #3a7d8c;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover { text-decoration: underline; }

    @media (max-width: 980px) {
      .hero { padding: 48px 24px; }
    }

    @media (max-width: 640px) {
      .hero {
        border-radius: 18px;
        padding: 36px 20px;
      }

      .hero img { width: 78px; }
      .hero p { font-size: 0.95rem; }
      .cta { width: 100%; max-width: 260px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img src="IMG-20260218-WA0015.jpg" alt="Logo Elayon">
      <h1>Elayon Space</h1>
      <p>Tecnologia a serviço da vida</p>
      <a class="cta" href="acesso.html">Entrar no Elayon</a>
    </section>
  </main>

  <footer>
    <div class="footer-links">
      <a href="sobre.html">Sobre</a>
      <a href="tecnologia.html">Tecnologia</a>
      <a href="ecossistema.html">Ecossistema</a>
    </div>
    <div>Elayon Space • entrada e verificação</div>
  </footer>
</body>
</html>
